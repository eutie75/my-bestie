<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magical Heart</title>
<style>
  :root { color-scheme: dark; --bg:#000; --hint:#93c5fd; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body { height:100%; margin:0; background:var(--bg); overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom,0px)); text-align:center; font:14px system-ui,sans-serif; color:var(--hint); opacity:.7; pointer-events:none; }
  .msg { position:fixed; left:0; width:100%; text-align:center; transform:translateY(-50%); font:italic 600 28px Georgia,'Times New Roman',serif; color:#eff6ff; text-shadow:0 0 8px #60a5fa,0 0 22px #2563eb; pointer-events:none; white-space:nowrap; animation:glow 3s ease-in-out infinite; }
  @keyframes glow { 50% { text-shadow:0 0 12px #93c5fd,0 0 34px #3b82f6; } }
  .edit { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(46px + env(safe-area-inset-bottom,0px)); width:min(80%,320px); padding:10px 14px; font:16px system-ui,sans-serif; color:#eff6ff; background:rgba(29,78,216,.25); border:1px solid #3b82f6; border-radius:999px; outline:none; text-align:center; }
  .edit::placeholder { color:#93c5fd; opacity:.7; }
  .photo { position:fixed; display:none; object-fit:cover; border-radius:50%; border:2px solid #60a5fa; box-shadow:0 0 16px #3b82f6,0 0 40px rgba(37,99,235,.7); pointer-events:none; }
  .photo.on { display:block; }
  .pbtn { position:fixed; right:12px; top:calc(12px + env(safe-area-inset-top,0px)); padding:8px 14px; font:14px system-ui,sans-serif; color:#eff6ff; background:rgba(29,78,216,.35); border:1px solid #3b82f6; border-radius:999px; cursor:pointer; }
  .note { position:fixed; left:50%; transform:translateX(-50%); text-align:center; font:15px/1.4 Georgia,'Times New Roman',serif; color:#bfdbfe; text-shadow:0 0 10px #2563eb; pointer-events:none; }
  .note-in { bottom:calc(92px + env(safe-area-inset-bottom,0px)); }
  .msg,.note,.photo { opacity:0; transition:opacity 2s ease 2s; }
  .note { transition-delay:3.2s; }
  body.show .msg, body.show .note, body.show .photo { opacity:1; }
  .edit,.pbtn { display:none; }
  body.editing .edit, body.editing .pbtn { display:block; }
  #intro { position:fixed; inset:0; z-index:50; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; color:#bfdbfe; font:italic 600 24px Georgia,'Times New Roman',serif; text-shadow:0 0 12px #2563eb; transition:opacity 1s; cursor:pointer; touch-action:manipulation; }
  #intro small { font:14px system-ui,sans-serif; opacity:.8; animation:pulse 1.8s ease-in-out infinite; }
  #intro.gone { opacity:0; pointer-events:none; }
  @keyframes pulse { 50% { opacity:.25; } }
</style>
</head>

<canvas id="c"></canvas>
<div id="intro">A little something for you, Faith 💙<small>Tap to open</small></div>
<div class="msg" id="msg">Faith Auma</div>
<div class="note" id="note">Faith, you're such a bright light in my life. Thank you for always being there for me.<br><br>You're stuck with me forever, Faith. No refunds. 😄<br>Best friend loading… 100% complete. Faith, you're the best!</div>

<label class="pbtn">Add photo<input type="file" id="file" accept="image/*" hidden></label>
<div class="hint">Tap anywhere for a burst</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let width, height, cx, cy, scale, poolY;
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  width = cv.clientWidth; height = cv.clientHeight;
  cv.width = width * d; cv.height = height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  cx = width / 2; cy = height * 0.42;
  scale = Math.min(width, height) / 42;
  poolY = cy + scale * 20;
  if (window.msgReady) fitMsg();
}
addEventListener('resize', resize); resize();

const BLUE_SHADES = ["#3b82f6", "#60a5fa", "#93c5fd", "#2563eb", "#bfdbfe", "#1d4ed8"];
const floatParticles = [], burstParticles = [];
const FLOAT_COUNT = 1400;
const rnd = (a, b) => a + Math.random() * (b - a);

function heartPoint() {
  const t = rnd(0, Math.PI * 2);
  const hx = 16 * Math.pow(Math.sin(t), 3);
  const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  const s = Math.random() < 0.7 ? rnd(0.9, 1.02) : Math.sqrt(Math.random()) * 0.9;
  return { x: cx + hx * s * scale, y: cy - hy * s * scale };
}

class Particle {
  constructor(x, y, type) {
    this.type = type;
    this.color = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
    if (type === "float") { this.maxLife = rnd(180, 320); this.reset(); }
    else {
      const a = rnd(0, Math.PI * 2), sp = rnd(1, 5);
      this.x = x; this.y = y; this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
      this.maxLife = rnd(40, 80); this.life = 0; this.size = rnd(0.8, 2.2);
    }
  }
  reset() {
    const p = heartPoint();
    this.tx = p.x; this.ty = p.y;
    this.sx = cx + rnd(-8, 8) * scale; this.sy = poolY + rnd(-1.5, 1.5) * scale;
    this.phase = rnd(0, 6.28); this.amp = rnd(0.2, 1.2); this.size = rnd(0.6, 1.8);
    this.life = 0;
  }
  update(time) {
    this.life++;
    if (this.type === "float") {
      if (this.life >= this.maxLife) this.reset();
      const k = Math.min(1, this.life / (this.maxLife * 0.4));
      const e = 1 - Math.pow(1 - k, 3);
      this.x = this.sx + (this.tx - this.sx) * e + Math.sin(time * 0.002 + this.phase) * this.amp * scale * 0.3;
      this.y = this.sy + (this.ty - this.sy) * e + Math.cos(time * 0.0017 + this.phase) * this.amp * scale * 0.3;
      this.alpha = Math.sin(Math.PI * this.life / this.maxLife);
    } else {
      this.x += this.vx; this.y += this.vy; this.vy += 0.05; this.vx *= 0.985;
      this.alpha = 1 - this.life / this.maxLife;
    }
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 6.283); ctx.fill();
  }
}

function spawnHeartBurst(x, y) {
  const count = 140;
  for (let i = 0; i < count; i++) burstParticles.push(new Particle(x, y, "burst"));
}

for (let i = 0; i < FLOAT_COUNT; i++) {
  const p = new Particle(0, 0, "float");
  p.life = Math.random() * p.maxLife; // stagger starting life
  floatParticles.push(p);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  spawnHeartBurst(e.clientX - r.left, e.clientY - r.top);
});

const miniHearts = [];
function drawMiniHearts(time) {
  if (miniHearts.length < 40 && Math.random() < 0.08) {
    miniHearts.push({ x: cx + rnd(-14, 14) * scale, y: poolY + rnd(-1, 2) * scale, s: rnd(0.5, 1.4) * scale * 0.5,
      vy: rnd(0.4, 1.1), ph: rnd(0, 6.28), life: 0, max: rnd(260, 420), color: BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)] });
  }
  for (let i = miniHearts.length - 1; i >= 0; i--) {
    const h = miniHearts[i];
    h.life++; h.y -= h.vy; h.x += Math.sin(time * 0.002 + h.ph) * 0.6;
    if (h.life >= h.max) { miniHearts.splice(i, 1); continue; }
    const s = h.s;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.globalAlpha = 0.85 * Math.sin(Math.PI * h.life / h.max);
    ctx.fillStyle = h.color; ctx.shadowColor = h.color; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s * 1.2, -s * 0.4, -s * 0.6, -s * 1.2, 0, -s * 0.5);
    ctx.bezierCurveTo(s * 0.6, -s * 1.2, s * 1.2, -s * 0.4, 0, s * 0.35);
    ctx.fill();
    ctx.restore();
  }
}

function drawPool(time) {
  const pulse = 1 + Math.sin(time * 0.003) * 0.06;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;
  ctx.translate(cx, poolY); ctx.scale(1, 0.28);
  const r = scale * 9 * pulse;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, 'rgba(191,219,254,0.95)');
  g.addColorStop(0.35, 'rgba(56,189,248,0.8)');
  g.addColorStop(1, 'rgba(29,78,216,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  ctx.restore();
}

const msgEl = document.getElementById('msg'), editEl = document.getElementById('edit');
const photoEl = document.getElementById('photo'), fileEl = document.getElementById('file');
const noteEl = document.getElementById('note'), noteIn = document.getElementById('notein');
noteIn.addEventListener('input', () => { noteEl.textContent = noteIn.value.trim(); });
fileEl.addEventListener('change', () => {
  const f = fileEl.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { photoEl.src = r.result; photoEl.classList.add('on'); fitMsg(); };
  r.readAsDataURL(f);
});
function fitMsg() {
  const len = Math.max(msgEl.textContent.length, 1);
  const hasPhoto = photoEl.classList.contains('on');
  msgEl.style.top = (hasPhoto ? cy + scale * 6.5 : cy) + 'px';
  const ps = scale * 9;
  photoEl.style.width = photoEl.style.height = ps + 'px';
  photoEl.style.left = (cx - ps / 2) + 'px';
  photoEl.style.top = (cy - scale * 3.5 - ps / 2) + 'px';
  noteEl.style.top = ((hasPhoto ? cy + scale * 6.5 : cy) + scale * 2.6) + 'px';
  noteEl.style.width = Math.min(scale * 24, width * 0.85) + 'px';
  noteEl.style.fontSize = Math.max(12, Math.min(15, scale * 1.4)) + 'px';
  msgEl.style.fontSize = Math.max(12, Math.min(scale * 2.8, (scale * 24) / (len * 0.5))) + 'px';
}
editEl.addEventListener('input', () => { msgEl.textContent = editEl.value.trim() || 'Faith Auma'; fitMsg(); });
let started = false, startTime = 0;
const introEl = document.getElementById('intro');
introEl.addEventListener('pointerdown', () => {
  if (started) return;
  started = true; startTime = performance.now();
  introEl.classList.add('gone');
  document.body.classList.add('show');
  setTimeout(() => introEl.remove(), 1200);
});
if (location.hash === '#edit') document.body.classList.add('editing');
window.msgReady = true;
fitMsg();

function frame(time) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(0, 0, width, height);
  ctx.globalCompositeOperation = 'lighter';
  if (started) { drawPool(time); drawMiniHearts(time); }
  const active = started ? Math.min(FLOAT_COUNT, Math.floor((time - startTime) / 3000 * FLOAT_COUNT)) : 0;
  for (let i = 0; i < active; i++) { const p = floatParticles[i]; p.update(time); p.draw(); }
  for (let i = burstParticles.length - 1; i >= 0; i--) {
    const p = burstParticles[i]; p.update(time);
    if (p.life >= p.maxLife) burstParticles.splice(i, 1); else p.draw();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
